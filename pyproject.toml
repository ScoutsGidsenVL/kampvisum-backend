# syntax-documentation:
#  - https://packaging.python.org/en/latest/specifications/pyproject-toml/
#  - https://docs.astral.sh/uv/concepts/projects/
#
# NOTE: you have to use single-quoted strings in TOML for regular expressions.
# It's the equivalent of r-strings in Python.  Multiline strings are treated as
# verbose regular expressions by Black.  Use [ ] to denote a significant space
# character.
#
#   > uv sync
#   > uv lock     (after changing dependencies)

[project]
name = "kampvisum-backend"
version = "1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.39",
    "cffi>=1.16.0",
    "django>=5.2,<6.0",
    "django-anymail[sendinblue]>=10.2",
    "django-cors-headers>=4.3.1",
    "django-cprofile-middleware>=1.0.5",
    "django-filter>=23.5",
    "django-rest-enumfield>=0.2.0",
    "django-safedelete>=1.3.3",
    "django-sql-middleware>=0.0.7",
    "django-storages>=1.14.2",
    "djangorestframework>=3.18",
    "drf-yasg>=1.21.4",
    "environs>=10.3.0",
    "future>=0.18.3",
    "gunicorn>=26,<27",
    "marshmallow>=3.26.2,<4",
    "mozilla-django-oidc>=5.0.2",
    "pdfrw>=0.4",
    "psycopg2-binary>=2.9.9",
    "pyjwt>=2.8.0",
    "PyYAML>=6.0.1",
    "urllib3>=2.8.0",
]

[dependency-groups]
# tools voor ontwikkeling en CI; Ansible installeert met --no-dev
dev = [
    "pytest>=9.0.3",
    "pytest-django>=4.5.2",
    "pytest-mock>=3.6",
    "black>=24.4.2",
    "ruff>=0.0",
]

[tool.uv]
# applicatie, geen pakket: uv bouwt of installeert het project zelf niet
package = false


[tool.black]
line-length = 120
target-version = ["py311"]


[tool.pytest.ini_options]
cache_dir = "var/cache/pytest"
filterwarnings = []
log_cli = false  # enable to show log-output
log_cli_level = "NOTSET"
markers = ["unit", "integration"]
pythonpath = [".", "src"]
testpaths = ["tests"]
# the junit-report is used to report coverage in gitlab
addopts = "--color=yes --junit-xml=\"${CACHE_DIR}/coverage/pytest-BBBB.xml\""
DJANGO_SETTINGS_MODULE = "scouts_kampvisum_api.settings"


[tool.ruff]
# ruff searches for settings in the target-dir and up
# https://docs.astral.sh/ruff/configuration
cache-dir = "var/cache/ruff"
line-length = 120

[tool.ruff.format]
preview = true
