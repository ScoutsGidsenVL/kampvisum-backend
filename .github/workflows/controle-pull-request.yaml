name: Controle pull request

on:
  pull_request:
    branches: [ "staging" ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  controle:
    runs-on: ubuntu-latest
    services:
      # de tests gebruiken de database; productie draait PostgreSQL 13
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: kampvisum
          POSTGRES_USER: kampvisum
          POSTGRES_PASSWORD: dummy
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # enkel dummywaarden, geen secrets; de overige instellingen komen uit .env.development
      SECRET_KEY: dummy
      DBNAME: kampvisum
      DBUSER: kampvisum
      DBPASSWORD: dummy
      DBHOST: localhost
      DBPORT: "5432"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # de Python-versie van de server
          python-version: "3.11"
      - name: uv.lock komt overeen met pyproject.toml
        run: |
          if ! uv lock --check; then
            echo "::error::uv.lock is niet bijgewerkt. Draai \`uv lock\` en commit uv.lock."
            exit 1
          fi
      - name: Installeren
        run: uv sync --locked
      - name: Django check
        run: uv run --no-sync python src/manage.py check
      - name: Tests
        run: uv run --no-sync pytest
